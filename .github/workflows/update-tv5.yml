name: Update tv5 playlist

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tv5
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download playlist
        env:
          PLAYLIST_URL: https://caonima.898757.xyz/sub/Zz0uFf9Cz0kp/playlist.m3u
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --max-time 60 "$PLAYLIST_URL" --output tv5.m3u8
          test -s tv5.m3u8

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- tv5.m3u8; then
            echo "No playlist changes"
            exit 0
          fi
          git add tv5.m3u8
          git diff --cached --quiet || git commit -m "Update tv5.m3u8"
          git push
